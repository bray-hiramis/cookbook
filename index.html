<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="css/main.css">
   <script src="https://kit.fontawesome.com/f911defdbe.js" crossorigin="anonymous"></script>
   <title>Cookbook | Recipe Finder</title>
</head>
<body>
   
   <nav>
      <div class="nav-container">
         <div class="padding-topbottom">
            <div class="nav-links">
               <ul class="nav-btn">
                  <li class="nav-link"><a href="">Favorites</a></li>
                  <li class="nav-link"><a href="">About</a></li>
                  <li class="nav-link"><a href="https://www.themealdb.com/" target="_blank"><strong>THEMEALDB.COM</strong></a></li>
               </ul>
            </div>
         </div>
      </div>
   </nav>

   <main>
      <div class="container">
         <div class="search-container">
            <div class="search-home">
               <h1 id="title"><span class="highlight">COOK</span>BOOK</h1>
               <form id="form-container">
                  <div id="searchbox-content">
                     <a href="" class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></a>
                     <input type="text" id="search-box" placeholder="e.g. Chicken Curry">
                  </div>
                  <div id="search-btn">
                     <button type="submit" id="main-search-btn" class="btn">Search Recipe</button>
                  </div>
               </form>
            </div>
         </div>
      </div>
   </main>

   <footer>
      <div class="container">
         <div class="padding-topbottom">
            <div class="footer-container">
               <div class="powered-by">
                  <p>Powered by <strong>themealdb API</strong>. Local Storage enabled.</p>
               </div>
               <div class="made-by">
                  <p>Made with ♥️ by Brian Hiramis | &copy; 2026</p>
                  <div class="socials">
                     <a href="https://github.com/bray-hiramis/cookbook" target="_blank"><i class="fa-brands fa-github"></i></a>
                     <a href="https://www.linkedin.com/in/john-brian-hiramis/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </footer>

   <script src="js/api.js"></script>
</body>
</html>
