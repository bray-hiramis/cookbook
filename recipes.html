<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="css/recipes.css">
   <script src="https://kit.fontawesome.com/f911defdbe.js" crossorigin="anonymous"></script>
   <title>Cookbook | Results</title>
</head>
<body>

   <div class="grid-container">
      <header id="header">
         <div class="container">
            <div class="padding-topbottom">
               <div class="search-container">
                  <a href="index.html"><strong><span class="highlight">COOK</span>BOOK</strong></a>
                  <div class="form-container">
                     <form action="recipes.html" method="GET" id="form">
                        <a href="" class="search-icon" id="search-icon-btn"><i class="fa-solid fa-magnifying-glass"></i></a>
                        <input type="text" id="search-box" name="search" placeholder="e.g. Chicken Curry">
                     </form>
                  </div>
               </div>
            </div>
         </div>
      </header>


      <main id="main">
         <div class="container">
            <div class="padding-topbottom">
               <div class="result-container">
                  <div id="result">
                     <!-- Dynamically update the content -->
                  </div>
                  <button type="button" class="btn" id="load-more-btn">Load More Recipes</button>
               </div>
            </div>
         </div>
      </main>
   </div>


   <script type="module" src="js/recipes.js"></script>
</body>
</html>
