<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="css/favorites.css">
   <script src="https://kit.fontawesome.com/f911defdbe.js" crossorigin="anonymous"></script>
   <title>Cookbook | Recipe Finder</title>
</head>

<body>
   
   <div class="grid-container-favorites">
      <nav id="nav">
         <div class="container">
            <div class="padding-topbottom">
               <div class="nav-container">
                  <div class="logo-container">
                     <a href="index.html" id="logo"><span class="highlight">COOK</span>BOOK</a>
                  </div>
                  <div class="nav-links">
                     <ul class="nav-btn">
                        <li class="nav-link"><a href="" class="nav-highlight">Favorites</a></li>
                        <li class="nav-link"><a href="">About</a></li>
                        <li class="nav-link"><a href="https://www.themealdb.com/" target="_blank"><strong>THEMEALDB.COM</strong></a></li>
                     </ul>
                  </div>
               </div>
            </div>
         </div>
      </nav>

      <main id="main">
         <div class="container">
            <div class="padding-topbottom">
               <div class="fav-title">
                  <h1>My Favorite Recipes</h1>
                  <p>Your personally curated collection</p>
               </div>
               <div class="search-filter-container">
                  <form action="favorites.html" method="GET" id="filter-box">
                     <span class="span-category">Select your category: </span><select id="category-filter">
                        <option value="All">All Categories</option>
                        <option value="Chicken">Chicken</option>
                        <option value="Pork">Pork</option>
                        <option value="Vegetarian">Vegetarian</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Seafood">Seafood</option>
                        <option value="Side">Side</option>
                     </select>
                  </form>
               </div>
               <div id="recipes-container">
                  
               </div>
            </div>
         </div>
      </main>

      <footer id="footer">
         <div class="container">
            <div class="padding-topbottom">
               <div class="footer-container">
                  <div class="powered-by">
                     <p>Powered by <strong>themealdb API</strong>. Local Storage enabled.</p>
                  </div>
                  <div class="made-by">
                     <p>Made with ♥️ by Brian Hiramis | &copy; 2026</p>
                     <div class="socials">
                        <a href="https://github.com/bray-hiramis/cookbook" target="_blank"><i class="fa-brands fa-github"></i></a>
                        <a href="https://www.linkedin.com/in/john-brian-hiramis/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </footer>
   </div>

   <script type="module" src="js/favorites.js"></script>

</body>
</html>
